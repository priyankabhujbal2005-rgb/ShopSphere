
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere - Register</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
        }

        .container {
            width: 400px;
            max-width: 85%;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
	input {
    	    width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: white;
            color: black !important;
            border: 2px solid #555555;
            border-radius: 6px;
            font-size: 16px;
            opacity: 1;
	}

	input::placeholder {
    	    color: #555555;
   	    opacity: 1;
  	}

	input:focus {
  	    outline: 2px solid #222222;
            border-color: #222222;
        }


	input:focus {
    	    outline: 2px solid #444444;
            border-color: #222222;
        }
        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #222;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .error {
            color: red;
            text-align: center;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Create Account</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Register</button>
        </form>

        <div class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </div>
    </div>
</body>
</html>
